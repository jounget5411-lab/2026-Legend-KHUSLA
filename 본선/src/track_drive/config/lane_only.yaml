# =====================================================================
# lane_only.yaml — "노란선만 보고 따라가기" 전용 설정 (연습/검증용)
#
# 왜 별도 파일인가
#   본선용 tuning.yaml 은 콘·정지선·지름길·신호등이 다 켜져 있고, 값도 대부분
#   시뮬(예선) 유래다. 그대로 복도/연습장에서 돌리면
#     - 라이다가 의자·벽·사람을 콘으로 오인해 CONE 모드로 빠지고
#     - stop 클래스 오검출 한 번에 차가 서고
#     - 신호등이 안 보여 WAIT 에서 못 나온다.
#   여기서는 "노랑 mid 하나만 보고 그 선을 따라간다" 만 남긴다.
#
# 로드 순서: tuning.yaml → car.yaml → 이 파일 (같은 키는 이 파일이 최종)
# 실행: ros2 launch track_drive drive_lane.launch.py
# =====================================================================

yolo_node:
  ros__parameters:
    # 모델이 640 으로 학습됐다. 416 으로 줄이면 추론은 빨라지지만 얇은 테이프를
    # 놓친다 — 지금 병목은 추론시간이 아니라 검출 거리라 640 을 쓴다.
    imgsz: 640
    conf_lane: 0.25
    # ★ mid(노랑)만 돌린다. 3모델 순차 6.3Hz → 1모델 약 10Hz.
    #   obj 를 끄면 STOP/CROSSROAD/GOAL/LEFT 가 아예 안 나와서
    #   정지선·지름길 오작동이 원천 차단된다.
    enable_lane: true
    enable_obj: false
    enable_light: false
    enable_child_dash: false
    device: "cpu"
    # ★ 8/9 재학습본 (밝은 조명 데이터 추가). 기존 lane.pt(7/29) 대비 오늘 사진에서
    #   mid 검출률 83% → 93%. 클래스는 동일 (bonsun-1 / lane / mid / stop).
    #   경로는 install 된 share/config 기준 절대경로여야 한다.
    lane_model_path: "/home/xytron/xycar_ws/install/track_drive/share/track_drive/config/lane_0812.pt"

path_planner_node:
  ros__parameters:
    # ---- 출발 ----
    # 신호등을 안 쓰므로 /manual_go 로만 출발한다.
    start_confirm_ticks: 6
    start_grace_sec: 9999.0        # 정지선/지름길 판정 자체를 평생 무시
    manual_go_fresh_sec: 2.0

    # ---- 차선 품질 ----
    lane_quality_min: 0.3
    low_quality_speed_cap: 6.0     # 품질 나쁠 때 상한 (기본 7.0 → 더 보수적)

    # ---- CONE 완전 차단 ----
    # 복도·연습장에는 콘이 없는데 의자/벽/사람이 콘 크기 클러스터로 잡힌다.
    # 진입 최소 개수를 도달 불가능한 값으로 올려 CONE phase 를 원천 봉쇄한다.
    cone_enter_min_clusters: 9999
    cone_enter_scans: 9999

    # ---- 나머지 phase 전부 off ----
    enable_pedestrian: false
    enable_child_zone: false
    enable_s_zone: false
    left_debounce_hits: 9999       # 지름길(LEFT 표지) 트리거 봉쇄

motion_node:
  ros__parameters:
    control_hz: 20.0

    # ================= 여기가 핵심 =================
    # 기존 값은 경로가 11m 까지 있다고 보고 4.2~5.0m 앞을 겨냥했다. 그런데 실차
    # 노란테이프는 BEV 점이 1.6m 안쪽에만 잡혀서, planner 가 내는 경로도
    # 0.3~2.5m 뿐이다 (lane_planner.SAMPLE_X_*). 그 상태로 4.5m 를 겨냥하면
    # 존재하지 않는 외삽 구간을 보고 조향하게 된다. 경로 길이에 맞춰 줄였다.
    lookahead_x_min: 0.3
    lookahead_x_max: 2.5
    steer_focus_base: 1.0          # 속도비례 lookahead 기준 (was 3.8)
    steer_focus_k: 0.020           # (was 0.055)
    steer_focus_min: 0.8           # (was 4.2)
    steer_focus_max: 2.0           # (was 5.0)
    steer_focus_sigma: 0.70        # 가중 폭도 같이 좁힌다 (was 1.8)
    steer_gain_distance_m: 1.0     # (was 2.4)
    steer_preview_distance_m: 2.0  # (was 5.5)
    preview_distance_m: 2.0        # (was 5.0)

    # lookahead 가 4.5m → 1.2m 로 줄면 같은 횡오차에도 추종각이 약 4배로 커진다.
    # 그래서 게인을 같은 비율로 낮춘 값에서 시작한다. ★ 이 4개는 실차에서
    # 반드시 다시 만져야 한다 — 계산으로 맞출 수 있는 값이 아니다.
    #   차가 좌우로 갈지자 → 더 낮춘다 / 코너를 못 돌고 밖으로 나감 → 올린다
    curve_pursuit_gain: 0.45       # (was 1.62)
    curve_heading_gain: 0.60       # (was 2.22)
    straight_pursuit_gain: 0.08
    straight_heading_gain: 0.08

    # ---- 조향 스무딩: 경로가 짧아 튀기 쉬우니 더 눌러둔다 ----
    angle_smooth_alpha: 0.45       # (was 0.55) 작을수록 더 부드럽게
    angle_max_step: 9.0            # (was 12.0)
    angle_deadband: 0.8            # (was 0.6)

    # ---- 속도: teleop 에서 w 3번 누른 정도 ----
    # teleop speed_step 2.0 → w×3 = 명령 6. cmd_to_ms 0.08 → 6×0.08 = 0.48 m/s.
    # w×2(=4)는 speed_deadzone 4.0 이라 안 구른다. 그래서 하한은 5로 잡는다
    # (car.yaml speed_min_drive 5.0 = 중재 최종 하한과도 일치).
    # 본선용 24(=1.92m/s)는 조향 게인 검증 전엔 절대 금지.
    speed_default: 6.0             # (was 24.0)  ← w 3번
    speed_curve_base: 5.5          # (was 20.0)
    speed_min: 5.0                 # 데드존(4.0) 위 — 이 밑은 명령만 나가고 안 구른다
    corner_inside_speed: 5.0       # (was 7.2)
    corner_boost_speed: 5.5        # (was 9.0)
    preview_slow_speed: 5.0        # (was 4.5) 데드존 아래로 못 내려가게

    # ---- 경로가 끊겨도 바로 서지 않게 ----
    # 실측 성공률 80%, 최장 끊김 1.3~2.2초. 0.5초에 정지하면 계속 멈칫거린다.
    # 0.64m/s 에서 1.5초면 약 1m 를 직전 조향 그대로 가는 것 — 느린 지금은 안전하다.
    # ★ 속도를 올리면 이 값도 같이 줄여야 한다.
    path_stale_sec: 0.8            # (was 0.5)
    lane_lost_decel_sec: 1.5       # (was 1.0)
